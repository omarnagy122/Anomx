services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: anomx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      anomx_default:
        aliases:
          - zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: anomx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1001
      KAFKA_RESERVED_BROKER_MAX_ID: 10000
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      anomx_default:
        aliases:
          - kafka

  postgres:
    image: postgres:15
    container_name: anomx-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: anomx
      POSTGRES_PASSWORD: anomx123
      POSTGRES_DB: anomx_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anomx -d anomx_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      anomx_default:
        aliases:
          - postgres

volumes:
  pgdata:

networks:
  anomx_default:
    name: anomx_default
